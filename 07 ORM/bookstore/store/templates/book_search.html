<!DOCTYPE html>
<html>
<head>
    <title>Book Search</title>
</head>
<body>

<h1>Book Search</h1>

<form method="GET">
    <input
        type="text"
        name="q"
        value="{{ query }}"
        placeholder="Search book or author"
    >

    <button type="submit">Search</button>
</form>

<hr>

<table border="1" cellpadding="10">
    <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Country</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Published Date</th>
        </tr>
    </thead>

    <tbody>
        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author.name }}</td>
            <td>{{ book.author.country }}</td>
            <td>{{ book.price }}</td>
            <td>{{ book.stock }}</td>
            <td>{{ book.published_date }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6">No books found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
